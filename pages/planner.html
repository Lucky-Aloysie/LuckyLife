<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuckyLife • Planner</title>

  <link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../css/planner.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">LuckyLife 🌿</div>

    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="planner.html" class="active">Planner</a>
      <a href="goals.html">Goals</a>
      <a href="memories.html">Memories</a>
      <a href="journal.html">Journal</a>
    </div>
  </nav>

  <!-- Header -->
  <header>
    <h1>Daily Planner</h1>
    <p>Create a beautiful schedule for your day ✨</p>
  </header>

  <main>

    <!-- Date -->
    <section class="card">
      <h3>📅 Choose Date</h3>
      <input type="date" id="planner-date">
    </section>

    <!-- Add Task -->
    <section class="card">
      <h3>➕ Add New Plan</h3>

      <div class="task-form">
        <input
          type="time"
          id="task-time"
          placeholder="Time"
        >

        <input
          type="text"
          id="task-name"
          placeholder="Morning prayer, work, gym..."
        >

        <button id="add-task-btn">
          Add Plan
        </button>
      </div>
    </section>

    <!-- Schedule -->
    <section class="card">
      <h3>🌿 Today's Schedule</h3>

      <div id="task-list" class="task-list"></div>
    </section>

  </main>

  <!-- Planner JavaScript -->
  <script src="../js/planner.js"></script>

  <script>
    document
      .getElementById("add-task-btn")
      .addEventListener("click", addTask);
  </script>

</body>
</html>
