<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuckyLife • Goals</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">LuckyLife 🌿</div>

    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="planner.html">Planner</a>
      <a href="goals.html" class="active">Goals</a>
      <a href="memories.html">Memories</a>
      <a href="journal.html">Journal</a>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <h1>My Goals 🎯</h1>
    <p>Every dream begins with one intentional step.</p>
  </header>

  <!-- Main -->
  <main>

    <section class="card">

      <span class="label">NEW GOAL</span>

      <h2 style="margin:10px 0 20px;color:#174A32;">
        Create a New Goal
      </h2>

      <label>Goal Title</label>
      <input
        type="text"
        id="goalTitle"
        placeholder="Example: Save $10,000"
      >

      <label>Category</label>
      <select id="goalCategory">
        <option>Financial</option>
        <option>Career</option>
        <option>Health</option>
        <option>Spiritual</option>
        <option>Personal</option>
      </select>

      <label>Progress (%)</label>
      <input
        type="range"
        id="goalProgress"
        min="0"
        max="100"
        value="0"
      >

      <p id="progressValue" style="margin:10px 0;color:#174A32;font-weight:bold;">
        0% completed
      </p>

      <button onclick="addGoal()">
        Save Goal 🎯
      </button>

    </section>

    <section style="margin-top:40px;">

      <div class="section-title">
        <h2>My Dream Board</h2>
        <p>Keep building the future you're praying for.</p>
      </div>

      <div id="goalGrid" class="goal-grid"></div>

    </section>

  </main>

  <footer>
    <p>Made with 🤍 by Lucky</p>
  </footer>

  <script src="../script.js"></script>

  <script>
    const slider = document.getElementById("goalProgress");
    const value = document.getElementById("progressValue");

    slider.addEventListener("input", () => {
      value.textContent = slider.value + "% completed";
    });
  </script>

</body>
</html>
